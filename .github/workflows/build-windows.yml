name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  bundle:
    name: Windows x64 bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Build unsigned Windows installers
        shell: pwsh
        run: |
          cd src-tauri
          npm exec --prefix ../frontend tauri build
      - name: Verify Windows installer outputs
        shell: pwsh
        run: |
          $msi = Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi"
          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe"
          if ($msi.Count -eq 0 -or $exe.Count -eq 0) {
            throw "Expected both MSI and NSIS installer outputs."
          }
      - name: Upload MSI and NSIS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Hero-Call-windows-x64
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
