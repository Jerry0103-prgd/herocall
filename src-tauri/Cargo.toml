[package]
name = "astock-ai-workbench"
version = "0.1.0"
description = "A股个人AI投研工作台"
authors = ["AStock-AI-Workbench"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "astock_ai_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
